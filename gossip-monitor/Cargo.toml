[package]
name = "gossip-monitor"
version = "0.14.0"
authors = ["Dave Jones"]
edition = "2021"

[dependencies]
iroh = "1"
iroh-gossip = { version = "0.101", features = ["net"] }
futures-lite = "2"
ed25519-dalek = { version = "3", features = ["rand_core"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tokio-stream = "0.1"
hex = "0.4"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
sha2 = "0.10"
